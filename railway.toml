[build]
# Railpack already runs `npm ci` in install. Re-running it causes
# EBUSY on the mounted node_modules/.vite cache.
buildCommand = "npx vite build"

[deploy]
preDeployCommand = ["chmod +x ./railway/init-app.sh ./start-container.sh && ./railway/init-app.sh"]
# Healthchecks can mark a healthy FrankenPHP boot as crashed during restarts.
# Use Railway's HTTP routing; Laravel still exposes /up for manual checks.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
